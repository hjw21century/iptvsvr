# IPTV-Hub 直播源服务 iptv.tomeleaf.com
# 后端：/data/code/iptv，systemd 单元 iptv-hub.service，只监听 127.0.0.1:8088。
limit_req_zone $binary_remote_addr zone=iptv:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name iptv.tomeleaf.com;
    return 301 https://iptv.tomeleaf.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name iptv.tomeleaf.com;

    ssl_certificate     /etc/letsencrypt/live/iptv.tomeleaf.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iptv.tomeleaf.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # 聚合的是第三方公开链接，不希望被搜索引擎收录
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript audio/x-mpegurl;

    limit_req zone=iptv burst=60 nodelay;

    # 触发更新的接口只允许本机调用（也可在 config.json 里再设 admin_token）
    location = /api/update {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # 网页内播放的中转：直播流要边收边发，必须关掉缓冲
    location = /proxy {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        gzip off;                 # 视频码流压缩没有意义，只会增加延迟
        limit_req zone=iptv burst=120 nodelay;
    }

    # 播放列表的缓存头由后端给（public, max-age=120），这里原样透传
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
